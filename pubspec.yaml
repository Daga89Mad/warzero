name: warzero
description: "Juego de cartas por turnos con temática de guerra futurista"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  cloud_firestore: ^6.0.0
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.0.15
  google_fonts: ^6.1.0

  # Red HTTP (usado por WarZeroApi). Estaba implícito; se declara explícitamente.
  http: ^1.2.0

  # Notificaciones push (turno resuelto → "ya puedes jugar"), iOS + Android.
  # firebase_messaging 16.x va alineado con firebase_core 4.x.
  firebase_messaging: ^16.0.0
  # Muestra la notificación cuando la app está en primer plano (Android no la
  # pinta sola) y crea el canal de Android.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/map_background.png
    - assets/images/Mapa8New.png
    - assets/images/Mapa8.png
    - assets/images/Mapa8New2.png
    - assets/images/Mapa8New3.png
    - assets/images/Mapa8New4.png
    - assets/images/Mapa8New4.webp