
name: warzero
description: "Juego de cartas por turnos con temática de guerra futurista"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  cloud_firestore: ^6.0.0
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.0.15
  google_fonts: ^6.1.0

  # Red HTTP usada por WarZeroApi.
  http: ^1.2.0

  # Notificaciones push para Android e iOS.
  firebase_messaging: ^16.0.0

  # Muestra notificaciones cuando la aplicación está en primer plano
  # y permite crear el canal de notificaciones de Android.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Genera automáticamente los iconos para Android e iOS.
  flutter_launcher_icons: ^0.14.4

# Configuración del icono de la aplicación.
# La ruta es relativa a la carpeta principal del proyecto.
flutter_launcher_icons:
  android: true
  ios: true

  # Icono general utilizado en Android e iOS.
  image_path: "assets/images/IconoWarZero.png"

  # Android.
  min_sdk_android: 21

  # Icono adaptativo de Android:
  # fondo negro y símbolo amarillo transparente por delante.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/IconoWarZero.png"

  # Espacio de seguridad para evitar que Android recorte el símbolo.
  adaptive_icon_foreground_inset: 16

  # iOS no admite transparencia en el icono publicado.
  # Se elimina la transparencia y se sustituye por fondo negro.
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/map_background.png
    - assets/images/Mapa8New.png
    - assets/images/Mapa8.png
    - assets/images/Mapa8New2.png
    - assets/images/Mapa8New3.png
    - assets/images/Mapa8New4.png
    - assets/images/Mapa8New4.webp
